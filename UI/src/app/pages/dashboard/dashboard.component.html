<div class="container-fluid py-3">
<div class="row align-items-stretch">
  <div class="col-md-12">
    <div class="card shadow-sm border-0 rounded-1">
      <div class="card-body d-flex justify-content-between align-items-center flex-wrap">

        <div class="d-flex align-items-center gap-2 mb-2">
          <label for="machineSelect" class="fw-bold mb-0">Machine:</label>
          <select id="machineSelect" [(ngModel)]="selectedMachine" (change)="changeDevice($event)" class="form-select form-select-sm">
            <option *ngFor="let machine of machines" [value]="machine.deviceId">{{ machine.machineName }}</option>
          </select>
        </div>

        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="fw-bold mb-0">Status:</span>
          <span class="badge status-badge" [ngClass]="{
              'text-bg-success': machineStatus === 'Running',
              'text-bg-warning': machineStatus === 'Idle',
              'text-bg-primary': machineStatus === 'Off'
            }">{{ machineStatus }}</span>
        </div>

        <div class="d-flex align-items-center gap-1 mb-2">
          <button class="btn btn-primary btn-sm arrow-btn" (click)="changeDate(-1)">
            <mat-icon class="small-arrow">arrow_back</mat-icon>
          </button>

          <input type="date" [(ngModel)]="selectedDate" (change)="changemmainDate($event)" [max]="today" class="form-control form-control-sm text-center" />

          <button class="btn btn-primary btn-sm arrow-btn" [disabled]="isCurrent" (click)="changeDate(1)">
            <mat-icon class="small-arrow">arrow_forward</mat-icon>
          </button>
        
            <button *ngIf="!isCurrent" class="btn btn-sm btn-warning arrow-btn">
            <mat-icon class="small-download">download</mat-icon>
          </button>
        </div>

        <div class="text-muted small fw-bold mb-2">
          Last Updated: <span>{{data?.lut}}</span>
        </div>

      </div>
    </div>
  </div>
</div>


  <div class="row mt-1 g-3 align-items-stretch">
    <div class="col-md-3">
      <div class="card shadow-sm border-0 rounded-1" style="height: 240px">
        <div class="card-body d-flex flex-column justify-content-center">
          <div class="d-flex align-items-center mb-2 justify-content-center gap-2">
            <h6 class="fw-bold mb-0">Efficiency</h6>
          </div>
          <div echarts [options]="gaugeOption" style="height: 160px; width: 100%"></div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-1" style="height: 240px">
        <div class="card-body d-flex flex-column">
          <div class="d-flex gap-2 mb-2">
            <div class="flex-fill bg-light rounded-3 p-2 text-center border">
              <div class="d-flex align-items-center justify-content-center gap-1">
                <mat-icon class="text-success" style="font-size: 20px">access_time</mat-icon>
                <span class="text-muted fw-bold small mb-0">Operating Time</span>
              </div>
              <div class="fs-6 fw-semibold text-success mt-1">{{data?.operatingTime}} hrs</div>
            </div>
            <div class="flex-fill bg-light rounded-3 p-2 text-center border">
              <div class="d-flex align-items-center justify-content-center gap-1">
                <mat-icon class="text-danger" style="font-size: 20px">warning</mat-icon>
                <span class="text-muted fw-bold small mb-0">Downtime</span>
              </div>
              <div class="fs-6 fw-semibold text-danger mt-1">{{data?.downTime}} hrs</div>
            </div>
            <div class="flex-fill bg-light rounded-3 p-2 text-center border">
              <div class="d-flex align-items-center justify-content-center gap-1">
                <mat-icon class="text-warning" style="font-size: 20px">notifications</mat-icon>
                <span class="text-muted fw-bold small mb-0">Alarms</span>
              </div>
              <div class="fs-6 fw-semibold text-warning mt-1">{{data?.alarm}}</div>
            </div>
          </div>
          <div class="flex-grow-1">
            <div echarts [options]="ganttOption" style="height: 120px; width: 100%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm border-0 rounded-1" style="height: 240px">
        <div class="card-body d-flex flex-column justify-content-center">
          <div class="d-flex align-items-center mb-2 justify-content-center gap-2">
            <h6 class="fw-bold mb-0">Energy</h6>
          </div>
          <div echarts [options]="progressOption" style="height: 160px; width: 100%"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="row g-3 mt-1 align-items-stretch">
    <div class="col-md-12">
      <div class="card shadow-sm border-0 rounded-3" style="height: 350px">
        <div class="card-body d-flex flex-column">
           <div class="flex-grow-1">
            <div echarts [options]="lineOption" style="height: 350px; width: 100%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
