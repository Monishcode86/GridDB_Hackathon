<nav class="navbar navbar-light fixed-top px-3 d-flex align-items-center justify-content-between flex-nowrap">
  <!-- Menu Button + Logo -->
  <div class="d-flex align-items-center">
    <img src="{{ sidebarOpen && !sidebarVisible ? 'WinLogo.png' : 'favLogo.png' }}"
         style="cursor: pointer;" 
         alt="Company Logo" 
         class="company-logo me-3"  
         (click)="toggleSidebar()" />
  </div>

  <!-- Date/Time + Logout -->
  <div class="d-flex align-items-center flex-nowrap">
    <span class="me-3 text-nowrap">{{ currentDateTime | date:'medium' }}</span>
    <div class="logout d-flex align-items-center" (click)="logout()">
      <mat-icon class="me-2">account_circle</mat-icon>
      <span class="d-none d-md-inline">Logout</span>
    </div>
  </div>
</nav>



<div class="sidebar-overlay" *ngIf="isMobile && sidebarVisible" (click)="sidebarVisible = false"></div>

<div class="layout">
    <nav class="sidebar" [class.collapsed]="isCollapsed && !isMobile" [class.mobile-show]="isMobile && sidebarVisible">
        <ul class="nav flex-column">
            <li class="nav-item" *ngFor="let item of menuItems; let i = index" (mouseenter)="onHoverMenu(i)"
                (mouseleave)="onHoverMenu(null)">
                <a class="nav-link" [routerLink]="!item.submenu ? item.route : null" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: !item.submenu }"
                    (click)="item.submenu ? toggleSubmenu(i) : selectMenu(i)">
                     <mat-icon>{{item.icon}}</mat-icon>
                    <span *ngIf="!isCollapsed || isMobile">{{ item.label }}</span>
               <mat-icon *ngIf="item.submenu && (!isCollapsed || isMobile)" class="ms-auto">
                        {{ openSubmenuIndex === i ? 'expand_less' : 'expand_more' }}
                    </mat-icon>
                </a>

                <ul class="submenu" *ngIf="
            item.submenu && openSubmenuIndex === i && (!isCollapsed || isMobile)
          ">
                    <li *ngFor="let sub of item.submenu">
                        <a class="nav-link" [routerLink]="sub.route" routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }" (click)="selectSubmenu()">
                            {{ sub.label }}
                        </a>
                    </li>
                </ul>

                <div class="hover-submenu" *ngIf="
            isCollapsed && !isMobile && hoverMenuIndex === i && item.submenu
          ">
                    <a *ngFor="let sub of item.submenu" class="nav-link" [routerLink]="sub.route"
                        routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="selectSubmenu()">
                        {{ sub.label }}
                    </a>
                </div>
            </li>
        </ul>
    </nav>

    <main class="content">
        <router-outlet></router-outlet>
    </main>
</div>
